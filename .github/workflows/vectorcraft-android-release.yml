name: Build and release VectorCraft Android APK

# Builds the newest upstream VectorCraft (storytold/vectorcraft) with the Android layer
# applied on top, then publishes the APK as a GitHub Release.
# Every night it looks at upstream's latest release: only when it is NEW (no android-v<version> release yet) does it
# build and release. Run it by hand for a specific ref, to rebuild with a new layer zip (tick force), or
# to test a build without publishing (untick publish: the APK is kept as a download for 14 days).
# The Android layer is the one zip android-layer/vectorcraft-android-layer.tar.gz in this repository;
# it carries apply_layer.py, make_notes.py and whats-new.md, so this file rarely needs editing.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch or tag to build (empty = main)"
        required: false
        default: ""
      force:
        description: "Build again even if this upstream version already has a release (new tag with -r<run>)"
        type: boolean
        default: false
      publish:
        description: "Publish a release (untick = build only, APK is attached to this run)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/vectorcraft
  TARGET: aarch64-linux-android
  NDK_VERSION: 28.2.13676358
  BT_VERSION: 35.0.0
  CARGO_TERM_COLOR: always
  MIN_RUST: "1.95"   # raise when a build says "requires rustc 1.xx"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Pick the upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          VAR_REF: ${{ vars.UPSTREAM_REF }}
        run: |
          # Default: upstream's latest published release (not main, whose Cargo.toml lags behind).
          LATEST=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if ! printf '%s' "$LATEST" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            LATEST=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM}.git" 'v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          fi
          REF="${INPUT_REF:-${VAR_REF:-${LATEST:-main}}}"
          echo "Building upstream ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out this repository (the Android layer lives here)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream VectorCraft
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: src

      - name: Work out the release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          SHA=$(git -C src rev-parse --short=7 HEAD)
          REF="${{ steps.ref.outputs.ref }}"
          # The tag is also the app's version name: the in-app updater compares it with the newest release tag.
          if printf '%s' "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${REF#v}"                 # an upstream release: the version comes from the tag name
            TAG="android-v${VER}"
          else
            VER=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)   # a branch or commit you typed in
            TAG="android-v${VER}-${SHA}"
          fi
          {
            echo "version=$VER"
            echo "sha=$SHA"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$([ "$PUBLISH" = "false" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != "false" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              # A newer tag for the same upstream commit (a new layer zip): the updater sees it as new.
              TAG="${TAG}-r${GITHUB_RUN_NUMBER}"
              sed -i "s|^tag=.*|tag=$TAG|" "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG already exists - nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the Android layer on top of upstream
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/layer"
          tar xzf ../fork/android-layer/vectorcraft-android-layer.tar.gz -C "$RUNNER_TEMP/layer"
          python3 "$RUNNER_TEMP/layer/apply_layer.py" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Rust version upstream asks for
        if: steps.ver.outputs.skip != 'true'
        run: |
          # Never go below MIN_RUST, even where the workspace says less.
          RUSTV=$(grep -m1 '^rust-version' src/Cargo.toml | cut -d'"' -f2)
          RUSTV=$(printf '%s\n%s\n' "${RUSTV:-$MIN_RUST}" "$MIN_RUST" | sort -V | tail -n1)
          rustup toolchain install "$RUSTV" --profile minimal --target "$TARGET"
          rustup default "$RUSTV"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src
          key: android-arm64

      - name: Install Android SDK parts
        if: steps.ver.outputs.skip != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;${BT_VERSION}" "ndk;${NDK_VERSION}"

      - name: Build native library (Rust)
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        working-directory: src
        run: |
          BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo build -p vectorcraft-android --target "$TARGET" --release -j 3 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Restore signing key
        if: steps.ver.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/vectorcraft-signing
          key: vectorcraft-signing-v1

      - name: Create signing key if missing
        if: steps.ver.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/vectorcraft-signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ~/vectorcraft-signing/key.p12
            printf '%s' "$KS_PASS" > ~/vectorcraft-signing/password.txt
          elif [ ! -f ~/vectorcraft-signing/key.p12 ]; then
            openssl rand -base64 24 > ~/vectorcraft-signing/password.txt
            keytool -genkeypair -keystore ~/vectorcraft-signing/key.p12 -storetype PKCS12 \
              -storepass:file ~/vectorcraft-signing/password.txt -alias vectorcraft \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=VectorCraft Personal Android Build"
          fi

      - name: Package and sign the APK
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BT_VERSION}"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          B="$RUNNER_TEMP/apk"
          mkdir -p "$B/classes" "$B/dex" "$B/res/drawable" dist
          cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.vectorcraft.png "$B/res/drawable/icon.png"

          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d "$B/classes" \
            packaging/android/java/ai/storyteller/vectorcraft/*.java
          jar cf "$B/classes.jar" -C "$B/classes" .
          "$BT/d8" --release --min-api 28 --lib "$PLATFORM" --output "$B/dex" "$B/classes.jar"
          "$BT/aapt2" compile --dir "$B/res" -o "$B/resources.zip"
          "$BT/aapt2" link -I "$PLATFORM" --manifest packaging/android/AndroidManifest.xml \
            --version-code "$(( $(date +%s) / 60 ))" --version-name "${TAG}" \
            -o "$B/unsigned.apk" "$B/resources.zip"

          B="$B" LIB="target/${TARGET}/release/libvectorcraft_android.so" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          b = Path(os.environ["B"])
          with zipfile.ZipFile(b / "unsigned.apk", "a", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(b / "dex/classes.dex", "classes.dex")
              z.write(os.environ["LIB"], "lib/arm64-v8a/libvectorcraft_android.so")
              for p in ["LICENSE-MIT", "LICENSE-APACHE", "ATTRIBUTION.md",
                        "assets/app-icon/LICENSE.txt", "vendor/winit/LICENSE"]:
                  if Path(p).exists():
                      z.write(p, "assets/licenses/" + p.replace("/", "_"))
          PY

          "$BT/zipalign" -f -P 16 4 "$B/unsigned.apk" "$B/aligned.apk"
          APK="dist/VectorCraft-${VERSION}-android-arm64-v8a.apk"
          "$BT/apksigner" sign --ks ~/vectorcraft-signing/key.p12 --ks-key-alias vectorcraft \
            --ks-pass "file:$HOME/vectorcraft-signing/password.txt" --out "$APK" "$B/aligned.apk"
          "$BT/apksigner" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Keep the APK (build-only run)
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-android-apk
          path: src/dist/*.apk
          retention-days: 14

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # The previous Android release: its commit (for "what changed upstream") and its notes (so
          # Android news is not repeated).
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("android-v")) | select(.tagName != $ENV.TAG)] | sort_by(.publishedAt) | reverse | .[0].tagName // ""' || true)
          PREV_SHA=""; PREV_VER=""
          : > "$RUNNER_TEMP/prev.md"
          if [ -n "$PREV_TAG" ]; then
            # android-v<ver>[-<sha7>][-<layer6>][-r<run>]  (the sha and layer parts exist on older releases)
            PREV_VER=$(printf '%s' "$PREV_TAG" | sed -E 's/^android-v//; s/-r[0-9]+$//; s/-[0-9a-f]{6}$//; s/-[0-9a-f]{7}$//')
            PREV_SHA=$(printf '%s' "$PREV_TAG" | sed -nE 's/^android-v.*-([0-9a-f]{7})(-[0-9a-f]{6})?(-r[0-9]+)?$/\1/p')
            gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/prev.md" || true
          fi

          # 1. Android news: only when whats-new.md has a section the previous release did not show.
          python3 "$RUNNER_TEMP/layer/make_notes.py" "$RUNNER_TEMP/layer/whats-new.md" \
            --prev-body "$RUNNER_TEMP/prev.md" --out "$RUNNER_TEMP/android.md" --readme "$GITHUB_WORKSPACE/fork/README.md"

          # 2. Upstream: its own release notes when the version is new, then its commits since the last build.
          : > "$RUNNER_TEMP/upstream.md"
          if [ "$PREV_VER" != "$VERSION" ]; then
            gh release view "v${VERSION}" --repo "$UPSTREAM" --json body --jq .body 2>/dev/null \
              | head -n 60 | sed -e 's/@/＠/g' -e 's/#\([0-9][0-9]*\)/\\#\1/g' > "$RUNNER_TEMP/upstream-release.md" || true
            if [ -s "$RUNNER_TEMP/upstream-release.md" ]; then
              { echo "## Upstream ${VERSION} release notes"; echo; cat "$RUNNER_TEMP/upstream-release.md"; echo; } >> "$RUNNER_TEMP/upstream.md"
            fi
          fi
          # What to compare with: the previous upstream version's tag, else the commit of an older-style release.
          BASE=""
          if [ -n "$PREV_VER" ] && git rev-parse -q --verify "refs/tags/v${PREV_VER}^{commit}" > /dev/null; then BASE="v${PREV_VER}"
          elif [ -n "$PREV_SHA" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then BASE="$PREV_SHA"; fi
          TO="$REF"; if ! git rev-parse -q --verify "refs/tags/${REF}" > /dev/null; then TO="$SHA"; fi
          if [ -n "$BASE" ] && [ "$(git rev-parse "${BASE}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            COUNT=$(git rev-list --no-merges --count "${BASE}..HEAD")
            if [ "$COUNT" -gt 0 ]; then
              UP=$(git log --no-merges --max-count=40 --pretty='- %s' "${BASE}..HEAD" | sed -e 's/@/＠/g' -e 's/#\([0-9][0-9]*\)/\\#\1/g')
              {
                echo "## Upstream changes"; echo
                echo "${COUNT} upstream changes since ${BASE} ([all of them](https://github.com/${UPSTREAM}/compare/${BASE}...${TO})):"; echo
                echo "$UP"
                if [ "$COUNT" -gt 40 ]; then echo "- …and $((COUNT - 40)) more"; fi
                echo
              } >> "$RUNNER_TEMP/upstream.md"
            fi
          fi

          # 3. Put it together: Android news first, then upstream, then the install notes.
          {
            echo "**VectorCraft ${VERSION} for Android** (early preview, ARM64)"
            echo
            echo "Built automatically from upstream \`${UPSTREAM}\` at \`${REF}\` (commit \`${SHA}\`) with the Android layer applied."
            echo
            cat "$RUNNER_TEMP/android.md" "$RUNNER_TEMP/upstream.md"
            if [ ! -s "$RUNNER_TEMP/android.md" ] && [ ! -s "$RUNNER_TEMP/upstream.md" ]; then
              echo "No changes since the previous Android build."; echo
            fi
            echo "## Install"
            echo
            echo "- Needs an ARM64 phone or tablet running Android 9 or newer with a Vulkan GPU."
            echo "- Download the \`.apk\`, open it, and allow installs from your file manager or browser when Android asks."
            echo "- No storage permission is needed: Open, Save As and Export use Android's own file picker."
            echo "- Early preview: no system clipboard or printing yet. A hardware keyboard is recommended."
            echo "- Unofficial build, not made or supported by the VectorCraft team. If an update will not install over an older build, uninstall the old one first."
          } > notes.md
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VectorCraft ${VERSION} Android" --notes-file notes.md

      - name: Update the feature list in the README
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.publish == 'true'
        continue-on-error: true
        working-directory: fork
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "README: update Android feature list"
            git push
          fi

      - name: Report a failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          touch "$LOG"
          ERR=$(grep -E -A8 '^(error|Error|Traceback|The winit|The Android|LAYER ERROR)' "$LOG" | head -n 80 || true)
          if [ -z "$ERR" ]; then ERR=$(tail -n 40 "$LOG"); fi
          ERR=$(printf '%s\n' "$ERR" | sed 's/@/＠/g')
          SIG=$(printf '%s' "$ERR" | sha256sum | cut -c1-12)
          {
            echo "The release build failed for upstream \`${UPSTREAM}\` at \`${REF}\`. No release was made; the previous one is still there."
            echo
            echo "Paste the lines below to Claude, and ask for a fixed layer file."
            echo
            echo '```'
            printf '%s\n' "$ERR"
            echo '```'
            echo
            echo "Full log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "<!-- error-signature:${SIG} -->"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          gh label create android-build-broken --repo "$GITHUB_REPOSITORY" --color B60205 --description "The Android layer does not build on upstream" --force || true
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label android-build-broken --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$N" ]; then
            # The same error as already reported: say nothing new.
            if gh issue view "$N" --repo "$GITHUB_REPOSITORY" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' 2>/dev/null | grep -q "error-signature:${SIG}"; then
              echo "This error is already reported in issue #$N."
            else
              gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md" || true
            fi
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Android release build failed (${REF})" --label android-build-broken --body-file "$RUNNER_TEMP/body.md" || echo "Could not open an issue: tick Settings > General > Features > Issues."
          fi
