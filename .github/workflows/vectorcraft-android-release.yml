name: Build and release VectorCraft Android APK

# Builds the newest upstream VectorCraft (storytold/vectorcraft) with the Android layer
# applied on top, then publishes the APK as a GitHub Release.
# It builds when upstream publishes a new version (a v* tag), when the Android layer changes, or
# when you run it by hand. Upstream commits between versions do not make a release.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch or tag to build (empty = main)"
        required: false
        default: ""
      force:
        description: "Build again even if this upstream version already has a release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/vectorcraft
  TARGET: aarch64-linux-android
  NDK_VERSION: 28.2.13676358
  BT_VERSION: 35.0.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Pick the upstream ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          VAR_REF: ${{ vars.UPSTREAM_REF }}
        run: |
          # Default: upstream's newest released version (a plain v1.2.3 tag), not its latest commit.
          LATEST=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM}.git" 'v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          REF="${INPUT_REF:-${VAR_REF:-${LATEST:-main}}}"
          echo "Building upstream ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out this repository (the Android layer lives here)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Check out upstream VectorCraft
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          path: src

      - name: Work out the release tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          VER=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
          SHA=$(git -C src rev-parse --short=7 HEAD)
          LAYER=$(sha256sum fork/android-layer/vectorcraft-android-layer.tar.gz | cut -c1-6)
          TAG="android-v${VER}-${SHA}-${LAYER}"
          {
            echo "version=$VER"
            echo "sha=$SHA"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG already exists - nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the Android layer on top of upstream
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          mkdir -p "$RUNNER_TEMP/layer"
          tar xzf ../fork/android-layer/vectorcraft-android-layer.tar.gz -C "$RUNNER_TEMP/layer"
          python3 "$RUNNER_TEMP/layer/apply_layer.py"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Rust version upstream asks for
        if: steps.ver.outputs.skip != 'true'
        run: |
          # egui 0.36 needs Rust 1.95 even where the workspace still says 1.90: never go below it.
          RUSTV=$(grep -m1 '^rust-version' src/Cargo.toml | cut -d'"' -f2)
          RUSTV=$(printf '%s\n%s\n' "${RUSTV:-1.95}" "1.95" | sort -V | tail -n1)
          rustup toolchain install "$RUSTV" --profile minimal --target "$TARGET"
          rustup default "$RUSTV"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src
          key: android-arm64

      - name: Install Android SDK parts
        if: steps.ver.outputs.skip != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;${BT_VERSION}" "ndk;${NDK_VERSION}"

      - name: Build native library (Rust)
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        run: |
          BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo build -p vectorcraft-android --target "$TARGET" --release -j 3

      - name: Restore signing key
        if: steps.ver.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/vectorcraft-signing
          key: vectorcraft-signing-v1

      - name: Create signing key if missing
        if: steps.ver.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/vectorcraft-signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ~/vectorcraft-signing/key.p12
            printf '%s' "$KS_PASS" > ~/vectorcraft-signing/password.txt
          elif [ ! -f ~/vectorcraft-signing/key.p12 ]; then
            openssl rand -base64 24 > ~/vectorcraft-signing/password.txt
            keytool -genkeypair -keystore ~/vectorcraft-signing/key.p12 -storetype PKCS12 \
              -storepass:file ~/vectorcraft-signing/password.txt -alias vectorcraft \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=VectorCraft Personal Android Build"
          fi

      - name: Package and sign the APK
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BT_VERSION}"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          B="$RUNNER_TEMP/apk"
          mkdir -p "$B/classes" "$B/dex" "$B/res/drawable" dist
          cp assets/app-icon/hicolor/256x256/apps/ai.storyteller.vectorcraft.png "$B/res/drawable/icon.png"

          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d "$B/classes" \
            packaging/android/java/ai/storyteller/vectorcraft/*.java
          jar cf "$B/classes.jar" -C "$B/classes" .
          "$BT/d8" --release --min-api 28 --lib "$PLATFORM" --output "$B/dex" "$B/classes.jar"
          "$BT/aapt2" compile --dir "$B/res" -o "$B/resources.zip"
          "$BT/aapt2" link -I "$PLATFORM" --manifest packaging/android/AndroidManifest.xml \
            --version-code "$(( $(date +%s) / 60 ))" --version-name "${TAG}" \
            -o "$B/unsigned.apk" "$B/resources.zip"

          B="$B" LIB="target/${TARGET}/release/libvectorcraft_android.so" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          b = Path(os.environ["B"])
          with zipfile.ZipFile(b / "unsigned.apk", "a", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(b / "dex/classes.dex", "classes.dex")
              z.write(os.environ["LIB"], "lib/arm64-v8a/libvectorcraft_android.so")
              for p in ["LICENSE-MIT", "LICENSE-APACHE", "ATTRIBUTION.md",
                        "assets/app-icon/LICENSE.txt", "vendor/winit/LICENSE"]:
                  if Path(p).exists():
                      z.write(p, "assets/licenses/" + p.replace("/", "_"))
          PY

          "$BT/zipalign" -f -P 16 4 "$B/unsigned.apk" "$B/aligned.apk"
          APK="dist/VectorCraft-${VERSION}-android-arm64-v8a.apk"
          "$BT/apksigner" sign --ks ~/vectorcraft-signing/key.p12 --ks-key-alias vectorcraft \
            --ks-pass "file:$HOME/vectorcraft-signing/password.txt" --out "$APK" "$B/aligned.apk"
          "$BT/apksigner" verify --verbose "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          cat > notes.md <<NOTES
          **VectorCraft ${VERSION} for Android** (early preview, ARM64)

          Built automatically from upstream \`${UPSTREAM}\` at \`${REF}\` (commit \`${SHA}\`) with the Android layer applied.

          - Needs an ARM64 phone or tablet running Android 9 or newer with a Vulkan GPU.
          - Download the \`.apk\`, open it, and allow installs from your file manager or browser when Android asks.
          - No storage permission is needed: Open, Save As and Export use Android's own file picker.
          - Early preview: no system clipboard or printing yet. A hardware keyboard is recommended.
          - Unofficial build, not made or supported by the VectorCraft team. If an update will not install over an older build, uninstall the old one first.
          NOTES
          # What changed since the previous Android release: upstream's own changes, and the Android
          # layer's changes only when the layer itself is new.
          CUR_LAYER="${TAG##*-}"
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("android-v")) | select(.tagName != $ENV.TAG)] | sort_by(.publishedAt) | reverse | .[0].tagName // ""' || true)
          PREV_SHA=""
          PREV_LAYER=""
          if [ -n "$PREV_TAG" ]; then
            PREV_LAYER="${PREV_TAG##*-}"
            REST="${PREV_TAG%-*}"
            PREV_SHA="${REST##*-}"
          fi
          COUNT=0
          UP=""
          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$SHA" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            COUNT=$(git rev-list --no-merges --count "${PREV_SHA}..HEAD")
            # No @name (it would notify people) and no #123 (it would link to this repository's issues).
            UP=$(git log --no-merges --max-count=40 --pretty='- %s' "${PREV_SHA}..HEAD" | sed -e 's/@/＠/g' -e 's/#\([0-9][0-9]*\)/\\#\1/g')
          fi
          WROTE=0
          if [ "$COUNT" -gt 0 ]; then
            {
              echo
              echo "## Upstream changes"
              echo
              echo "${COUNT} changes since the previous Android build ([all of them](https://github.com/${UPSTREAM}/compare/${PREV_SHA}...${SHA})):"
              echo
              echo "$UP"
              if [ "$COUNT" -gt 40 ]; then echo "- …and $((COUNT - 40)) more"; fi
            } >> notes.md
            WROTE=1
          fi
          if [ -f "$RUNNER_TEMP/layer/whats-new.md" ] && [ "$PREV_LAYER" != "$CUR_LAYER" ]; then
            { echo; echo "## Android changes"; echo; cat "$RUNNER_TEMP/layer/whats-new.md"; } >> notes.md
            WROTE=1
          fi
          if [ "$WROTE" = "0" ]; then
            { echo; echo "No changes since the previous Android build."; } >> notes.md
          fi
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VectorCraft ${VERSION} Android (${SHA})" --notes-file notes.md
